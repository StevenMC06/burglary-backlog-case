<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif"><style>text{fill:#16131f} .m{fill:#555c58} </style><rect width="900" height="300" rx="10" fill="#fff" stroke="#d5ddd7"/><text x="20" y="30" font-size="17" font-weight="650">Pair funnel: 2,000 seed cases, threshold 0.9 (log scale)</text><text x="20" y="75" font-size="13">all pairs  n(n−1)/2</text><rect x="300" y="56" height="26" rx="3" fill="#c9d2cc" width="390.0"><animate attributeName="width" from="0" to="390.0" dur="1s" begin="0.00s" fill="freeze"/></rect><text x="698.0" y="74" font-size="13" font-weight="650">1,999,000<tspan class="m" font-weight="400"> (100.00%)</tspan></text><text x="20" y="119" font-size="13">inside 180-day window (sweep)</text><rect x="300" y="100" height="26" rx="3" fill="#d2c2ff" width="381.6"><animate attributeName="width" from="0" to="381.6" dur="1s" begin="0.25s" fill="freeze"/></rect><text x="689.6" y="118" font-size="13" font-weight="650">1,461,811<tspan class="m" font-weight="400"> (73.13%)</tspan></text><text x="20" y="163" font-size="13">inside 30 km box</text><rect x="300" y="144" height="26" rx="3" fill="#d2c2ff" width="381.6"><animate attributeName="width" from="0" to="381.6" dur="1s" begin="0.50s" fill="freeze"/></rect><text x="689.6" y="162" font-size="13" font-weight="650">1,461,811<tspan class="m" font-weight="400"> (73.13%)</tspan></text><text x="20" y="207" font-size="13">pass score upper bound</text><rect x="300" y="188" height="26" rx="3" fill="#6425ff" width="299.4"><animate attributeName="width" from="0" to="299.4" dur="1s" begin="0.75s" fill="freeze"/></rect><text x="607.4" y="206" font-size="13" font-weight="650">68,781<tspan class="m" font-weight="400"> (3.44%)</tspan></text><text x="20" y="251" font-size="13">edges ≥ 0.9</text><rect x="300" y="232" height="26" rx="3" fill="#0f6a2e" width="178.3"><animate attributeName="width" from="0" to="178.3" dur="1s" begin="1.00s" fill="freeze"/></rect><text x="486.3" y="250" font-size="13" font-weight="650">761<tspan class="m" font-weight="400"> (0.04%)</tspan></text><text x="20" y="286" font-size="12" class="m">Only the 68,781 pairs that pass the bound get MO scoring; brute force scored all 1,461,811 in the window.</text></svg>